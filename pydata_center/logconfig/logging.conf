[loggers]
keys=root,myapp

[handlers]
keys=consoleHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_myapp]
level=DEBUG
handlers=consoleHandler
qualname=myapp
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=defaultFormatter
args=(sys.stdout,)

[formatter_defaultFormatter]
format=[%(asctime)s] %(levelname)s %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
