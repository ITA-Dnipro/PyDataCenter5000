name: agents tests

on:
  pull_request:
    paths:
      - agents/**
      - .github/**
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - agents/**
      - .github/**
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.6, 2.7]

    steps:
      - uses: actions/checkout@v3

      - name: Agents Unit Tests (Python 2.6 - Custom Docker Image with coverage)
        if: matrix.python-version == '2.6'
        run: |
          docker run --rm \
            -v "$PWD":/pydata \
            ghcr.io/yelyzavetav/ubuntu-python2.6:latest \
            bash -c "
              cd /pydata && \
              python -m pytest -c agents/pytest.ini -m 'not integration' agents --cov=agents --cov-report=xml --cov-config=agents/.coveragerc
            "

      - name: Agents Unit Tests (Python 2.7 - Official Docker Image)
        if: matrix.python-version == '2.7'
        run: |
          docker run --rm \
            -v "$PWD":/pydata \
            python:2.7 \
            bash -c "
              cd /pydata && \
              pip install -r agents/requirements.txt && \
              pip install pytest && \
              python -m pytest -c agents/pytest.ini -m 'not coro' agents
            "

      - name: Upload Coverage Report to Codecov
        if: matrix.python-version == '2.6'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
