services:
  db:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    ports:
      - "5435:5432" 
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: pydata_center/Dockerfile
    container_name: controller
    restart: on-failure
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ../pydata_center:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check", "--deploy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  web_agent:
    build:
      context: ../agents_infra
      dockerfile: docker/Dockerfile_web
    container_name: web_agent
    restart: on-failure
    privileged: true
    cgroup: host
    command: /sbin/init
    volumes:
      - ../agents_infra/agents_infra:/app/agents_infra
      - ../agents_infra/scripts:/app/scripts
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    depends_on:
      - app

  dns_agent:
    build:
      context: ../agents_infra
      dockerfile: docker/Dockerfile_dns
    container_name: dns_agent
    restart: on-failure
    privileged: true
    cgroup: host
    command: /sbin/init
    volumes:
      - ../agents_infra/agents_infra:/app/agents_infra
      - ../agents_infra/scripts:/app/scripts
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    depends_on:
      - app


  ntp_agent:
    build:
      context: ../agents_infra
      dockerfile: docker/Dockerfile_ntp
    container_name: ntp_agent 
    restart: on-failure
    privileged: true
    cgroup: host
    command: /sbin/init
    volumes:
      - ../agents_infra/agents_infra:/app/agents_infra
      - ../agents_infra/scripts:/app/scripts
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    depends_on:
      - app

  
  smtp_agent:
    build:
      context: ../agents_infra
      dockerfile: docker/Dockerfile_smtp
    container_name: smtp_agent 
    restart: on-failure
    privileged: true
    cgroup: host
    command: /sbin/init
    volumes:
      - ../agents_infra/agents_infra:/app/agents_infra
      - ../agents_infra/scripts:/app/scripts
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    depends_on:
      - app


volumes:
  db_data:
