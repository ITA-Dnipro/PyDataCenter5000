name: agents tests

on:
  pull_request:
    paths:
      - agents/**
      - .github/**
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - agents/**
      - .github/**
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.6, 2.7]
    steps:
      - uses: actions/checkout@v3

      - name: Agents Unit Tests (Python 2.6 - Docker)
        if: matrix.python-version == '2.6'
        run: |
          docker run --rm \
          -v "$PWD":/pydata \
          ghcr.io/yelyzavetav/ubuntu-python2.6:latest \
          bash -c "cd /pydata && python -m pytest agents"

      - name: Cache Pip Environment
        if: matrix.python-version == '2.7'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        if: matrix.python-version == '2.7'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: agents

      - name: Install pytest-cov
        if: matrix.python-version == '2.7'
        run: python -m pip install pytest-cov

      - name: Agents Unit Tests (Python 2.7 - Native)
        if: matrix.python-version == '2.7'
        run: python -m pytest --cov=agents
