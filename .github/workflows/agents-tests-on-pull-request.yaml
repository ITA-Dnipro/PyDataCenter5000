name: agents tests

on:
  pull_request:
    paths:
      - 'agents_infra/**'
      - '.github/**'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - 'agents_infra/**'
      - '.github/**'
    branches:
      - 'main'
      - 'develop'
      - 'fix-codecov'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.6, 2.7]

    steps:
      - uses: actions/checkout@v3

      - name: Agents Unit Tests (Python 2.6 - Custom Docker Image with coverage)
        if: matrix.python-version == '2.6'
        run: |
          docker run --rm \
            -v "$PWD":/pydata \
            ghcr.io/yelyzavetav/ubuntu-python2.6:latest \
            bash -c "
              cd /pydata && \
              python -m pytest \
                -c agents_infra/agents_infra/pytest.ini \
                -m 'not integration' \
                agents_infra/agents_infra \
                --cov=agents_infra/agents_infra \
                --cov-report=xml:coverage-agents.xml \
                --cov-config=agents_infra/agents_infra/.coveragerc
            "

      - name: Agents Unit Tests (Python 2.7 - Official Docker Image)
        if: matrix.python-version == '2.7'
        run: |
          docker run --rm \
            -v "$PWD":/pydata \
            python:2.7 \
            bash -c "
              cd /pydata && \
              pip install -r agents_infra/requirements.txt && \
              pip install pytest pytest-cov && \
              python -m pytest \
                -c agents_infra/agents_infra/pytest.ini \
                -m 'not coro' \
                agents_infra/agents_infra \
                --cov=agents_infra/agents_infra \
                --cov-report=xml:coverage-agents.xml \
                --cov-config=agents_infra/agents_infra/.coveragerc
            "

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-agents.xml
          flags: agents_infra
          verbose: true
