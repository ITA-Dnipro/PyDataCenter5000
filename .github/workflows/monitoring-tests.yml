name: monitoring tests

on:
  push:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - 109-hotfix-github-tests-for-monitoring-app
  pull_request:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - 109-hotfix-github-tests-for-monitoring-app
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    working-directory: pydata_center

jobs:
  monitoring-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Export Django secret key from GitHub Secrets
      run: echo "SECRET_KEY=${{ secrets.DEV_SECRET_KEY }}" >> $GITHUB_ENV


    - name: Cache Pip Environment
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python 3.8
      uses: actions/setup-python@v3
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest==8.3.5 pytest-cov==4.1.0 codecov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run monitoring tests with coverage
      run: |
        pytest monitoring --cov=monitoring --cov-report=xml:coverage.xml --cov-report=term
      # env:
      #   SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: pydata_center/coverage.xml
        flags: monitoring
        verbose: true
