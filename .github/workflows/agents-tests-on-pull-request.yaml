name: Agents Tests

on:
  pull_request:
    paths:
      - 'agents_infra/**'
      - '.github/**'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - 'agents_infra/**'
      - '.github/**'
    branches:
      - 'main'
      - 'develop'
      - 'fix-codecov'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['2.6', '2.7']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Agents tests (Python ${{ matrix.python-version }})
        run: |
          cd $GITHUB_WORKSPACE
          if [ "${{ matrix.python-version }}" = "2.6" ]; then
            docker run --rm -v "$PWD":/pydata ghcr.io/yelyzavetav/ubuntu-python2.6:latest bash -c "
              apt-get update && apt-get install -y python-pip &&
              cd /pydata &&
              pip install -r agents_infra/requirements.txt &&
              pytest \
                -c agents_infra/agents_infra/pytest.ini \
                --cov=agents_infra/agents_infra \
                --cov-report=xml:coverage-agents.xml \
                -m 'not integration' \
                agents_infra/agents_infra
            "
          else
            docker run --rm -v "$PWD":/pydata python:2.7 bash -c "
              cd /pydata &&
              pip install -r agents_infra/requirements.txt &&
              pytest \
                -c agents_infra/agents_infra/pytest.ini \
                --cov=agents_infra/agents_infra \
                --cov-report=xml:coverage-agents.xml \
                -m 'not coro' \
                agents_infra/agents_infra
            "
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-agents.xml
          flags: agents_infra
          verbose: true
