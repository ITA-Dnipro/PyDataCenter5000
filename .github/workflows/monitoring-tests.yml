name: monitoring tests

on:
  push:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - fix-codecov
  pull_request:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - fix-codecov
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    working-directory: pydata_center

jobs:
  monitoring-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
    - uses: actions/checkout@v4

    - name: Cache Pip Environment
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python 3.8
      uses: actions/setup-python@v3
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest==8.3.5 pytest-cov==4.1.0 codecov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run monitoring tests with coverage
      run: |
        pytest monitoring \
          --cov=monitoring \
          --cov-report=xml:coverage-monitoring.xml \
          --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage-monitoring.xml
        flags: monitoring
        verbose: true
