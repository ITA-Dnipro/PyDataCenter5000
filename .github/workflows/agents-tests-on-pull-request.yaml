name: Run agents tests on pull request

on:
  pull_request:
    paths:
      - agents/**
      - .github/**
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - agents/**
      - .github/**
    branches:
      - main
      - develop
      - 65-add-github-workflow-to-run-tests-on-pr

jobs:
  python26:
    runs-on: ubuntu-latest
    name: Run agents unit tests in container(Python 2.6)
    steps:
      - uses: actions/checkout@v3

      - name: Run agents unit tests
        run: |
          docker run --rm \
          -v "$PWD":/workspace \
          ghcr.io/yelyzavetav/ubuntu-python2.6:latest \
          bash -c "cd /workspace && python -m pytest agents"

  python27:
    runs-on: ubuntu-latest
    container:
      image: python:2.7

    name: Run agents unit tests (Python 2.7)
    steps:
      - uses: actions/checkout@v3

      - name: Cache pip environment
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: agents

      - name: Run tests
        run: |
          python -m pytest -v
        working-directory: agents
