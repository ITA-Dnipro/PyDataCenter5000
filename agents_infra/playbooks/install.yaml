---
- name: Install agents-infra
  hosts: all
  become: yes
  vars:
    proj_root: "{{ playbook_dir }}/.."
    proj_env: &proj_env
      DEBIAN_FRONTEND: >-
        {{ lookup('env', 'DEBIAN_FRONTEND')
          | default('noninteractive', true) }}
      PYTHON_DIR: >-
        {{ lookup('env', 'PYTHON_DIR') | default('/opt/python2.6', true) }}
      INSTALL_CORO: >-
        {{ lookup('env', 'INSTALL_CORO') | default('true', true) }}

  tasks:
    - name: Fail if not Linux
      fail:
        msg: "agents_infra only supports Linux OS."
      when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

    - name: Set system vars
      set_fact:
        has_systemd: >-
          {{
            (ansible_facts['systemd'] is defined)
            and ansible_facts['systemd']
          }}

    - name: Initialize agents_infra directory
      file:
        path: /opt/agents_infra
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy agents_infra source
      synchronize:
        src: "{{ proj_root }}/{{ item }}"
        dest: /opt/agents_infra/
        recursive: yes
        owner: yes
        group: yes
        mode: push
      loop:
        - agents_infra/
        - scripts/
        - main.py

    # --- Package agents-infra ---
    - name: Ensure fpm is installed
      package:
        name: ruby-fpm
        state: present

    - name: Check collections paths
      debug:
        msg: "{{ lookup('config', 'collections_paths') }}"

    - name: Build .deb
      community.general.fpm:
        src: /opt/agents_infra
        output_path: "{{ proj_root }}/dist"
        version: "1.0.0"
        iteration: "1"
        description: "Agents Infra Service"
        architecture: "all"
        fpm_type: "deb"
      when: ansible_facts['os_family'] == 'Debian'

    # --- Build .zip archive ---
    - name: Initialize dist directory
      file:
        path: "{{ proj_root }}/dist"
        state: directory
        mode: '0755'

    - name: Build .zip artifact
      archive:
        path:
          - /opt/agents_infra
        dest: "{{ proj_root }}/dist/agents-infra.zip"
        format: zip

    # --- Copy systemd service file to run agents_infra as a service ---
    - name: Copy systemd service file
      copy:
        src: "{{ proj_root }}/agents-infra.service"
        dest: /etc/systemd/system/agents-infra.service
        owner: root
        group: root
        mode: '0644'

    - name: Install dependencies
      script: "{{ proj_root }}/scripts/install-dependencies.sh"
      environment: *proj_env
      register: result
      ignore_errors: yes

    - name: Fail if dependencies are missing
      fail:
        msg: "Found {{ result.rc }} missing dependencies!"
      when: result.rc != 0 and (fail_if_dep_missing | default(false))

    - name: Run tests
      command: >
        ${PYTHON_DIR}/bin/python -m pytest
        -m 'not integration' agents_infra
      environment: *proj_env
      args:
        chdir: "{{ proj_root }}"
      when: run_tests | default(false)

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: has_systemd

    - name: Enable and start agents-infra service
      systemd:
        name: agents-infra
        enabled: yes
        state: started
      when: has_systemd
