[loggers]
keys=root,fallback,agent,supervisor,health_server,main

[handlers]
keys=fallback,rotating

[formatters]
keys=minimal,detailed

[logger_root]
level=NOTSET
handlers=

[logger_fallback]
level=ERROR
handlers=fallback
qualname=fallback
propagate=0

[logger_agent]
level=INFO
handlers=rotating
qualname=%(agent_name)s
propagate=0

[logger_supervisor]
level=DEBUG
handlers=rotating
qualname=%(agent_name)s-supervisor
propagate=0

[logger_health_server]
level=INFO
handlers=rotating
qualname=%(agent_name)s-health-server
propagate=0

[handler_fallback]
class=StreamHandler
formatter=minimal
args=(sys.stdout,)

[handler_rotating]
class=agents_infra.utils.logtools.CustomTimedRotatingHandler
formatter=detailed
args=('%(log_path)s',)

[formatter_minimal]
format=%(levelname)s : %(message)s
style=%
class=logging.Formatter

[formatter_detailed]
format=%(asctime)s : %(name)s : %(levelname)s : %(message)s
style=%
class=logging.Formatter

[logger_main]
level=ERROR
handlers=fallback
qualname=main
propagate=0
