name: monitoring tests

on:
  push:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - 82_Set_Up_GitHub_Workflow_for_Unit_Tests_in_monitoring
  pull_request:
    paths:
      - pydata_center/monitoring/**
    branches:
      - main
      - develop
      - 82_Set_Up_GitHub_Workflow_for_Unit_Tests_in_monitoring
    types: [opened, synchronize, reopened, ready_for_review]


permissions:
  contents: read


defaults:
  run:
    working-directory: pydata_center


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache Pip Environment
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pydata_center/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python 3.8
      uses: actions/setup-python@v3
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov==2.4.0 codecov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test only monitoring app with pytest and coverage
      run: |
        pytest --cov=pydata_center.monitoring --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: monitoring
        verbose: true
