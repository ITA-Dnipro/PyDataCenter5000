---
- name: Package agents-infra
  hosts: all
  become: yes
  vars_files:
    - vars/common.yaml

  tasks:
    - name: Initialize dist directory
      file:
        path: "{{ proj_root }}/dist"
        state: directory
        mode: '0755'

    - name: Build .deb
      command: >
        fpm -s dir -t deb
        -n agents-infra
        -v 1.0.0
        -C /opt/agents_infra
        --prefix /opt/agents_infra
        .
      args:
        chdir: "{{ proj_root }}/dist"
      when: ansible_facts['os_family'] == 'Debian'
